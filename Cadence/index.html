<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ARCHIVO ACUE — CADENCE</title>

    <style>
        body {
            margin: 0;
            padding: 40px;
            background: #e8e8e8;
            color: #111;
            font-family: "Courier New", monospace;
        }

        .documento {
            max-width: 800px;
            margin: 0 auto;
            padding: 45px;
            background: #f5f5f5;
            border: 1px solid #999;
            box-shadow: 0 0 20px rgba(0,0,0,0.25);
        }

        .encabezado {
            border-bottom: 2px solid #111;
            padding-bottom: 15px;
            margin-bottom: 35px;
        }

        .acue {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 4px;
        }

        .clasificado {
            color: #900;
            font-weight: bold;
            margin-top: 8px;
        }

        .archivo {
            margin-bottom: 30px;
            line-height: 1.8;
        }

        .texto {
            font-size: 18px;
            line-height: 2;
        }

        .redactado {
            background: #111;
            color: #111;
            padding: 0 8px;
        }

        .pie {
            margin-top: 50px;
            padding-top: 15px;
            border-top: 1px solid #999;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="documento">

    <div class="encabezado">
        <div class="acue">ACUE CORPORATION</div>
        <div class="clasificado">ARCHIVO CONFIDENCIAL</div>
    </div>

    <div class="archivo">
        <strong>ENTIDAD:</strong> CADENCE<br>
        <strong>CLASIFICACIÓN:</strong> █████████<br>
        <strong>ESTADO:</strong> ACTIVO
    </div>

    <div class="texto">
        Este ser parece ser uno mismo con el tiempo,
        se alimenta de humanos, especialmente de la
        dimension ####
    </div>

    <div class="pie">
        ACUE CORPORATION — DIVISIÓN DE INVESTIGACIÓN<br>
        ACCESO NO AUTORIZADO SERÁ REGISTRADO
    </div>

</div>

</body>
</html>
