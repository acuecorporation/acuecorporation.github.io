<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOY BOY...</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #joy-boy {
      position: fixed;
      top: 50%; left: 50%;
      color: #fff;
      font: bold clamp(24px, 5vw, 52px) Arial, sans-serif;
      letter-spacing: .12em;
      white-space: nowrap;
      text-decoration: none;
      cursor: pointer;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>
  <a id="joy-boy" href="https://www.youtube.com/watch?v=s6FWjFYSKe8">JOY BOY...</a>
  <script>
    const text = document.getElementById('joy-boy');
    let x = 0, y = 0, vx = 38, vy = 27;
    let last = 0;

    function fit() {
      const rect = text.getBoundingClientRect();
      const maxX = Math.max(0, innerWidth - rect.width);
      const maxY = Math.max(0, innerHeight - rect.height);
      x = Math.min(Math.max(x, 0), maxX);
      y = Math.min(Math.max(y, 0), maxY);
    }

    function animate(time) {
      const dt = last ? Math.min((time - last) / 1000, 0.05) : 0;
      last = time;
      const rect = text.getBoundingClientRect();
      const maxX = Math.max(0, innerWidth - rect.width);
      const maxY = Math.max(0, innerHeight - rect.height);
      x += vx * dt;
      y += vy * dt;
      if (x < 0) { x = 0; vx = Math.abs(vx); }
      if (x > maxX) { x = maxX; vx = -Math.abs(vx); }
      if (y < 0) { y = 0; vy = Math.abs(vy); }
      if (y > maxY) { y = maxY; vy = -Math.abs(vy); }
      text.style.left = x + 'px';
      text.style.top = y + 'px';
      requestAnimationFrame(animate);
    }

    text.style.transform = 'none';
    x = (innerWidth - text.getBoundingClientRect().width) / 2;
    y = (innerHeight - text.getBoundingClientRect().height) / 2;
    addEventListener('resize', fit);
    requestAnimationFrame(animate);
  </script>
</body>
</html>
